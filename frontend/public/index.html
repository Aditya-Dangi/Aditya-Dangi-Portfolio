    <script>
      /*
       * Resolve the theme before first paint so there is no flash of the
       * wrong colour scheme. Mirrors src/lib/theme.js — keep the storage key
       * and the resolution rule in sync with it.
       */
      (function () {
        try {
          var metaColors = {
            light: "#ffffff",
            dark: "#08090b",
            beige: "#f3ede2",
            brown: "#1a120b",
            nordic: "#0d1520",
            contrast: "#000000",
          };
          var stored = window.localStorage.getItem("ad-portfolio-theme");
          var preference =
            stored === "light" ||
            stored === "dark" ||
            stored === "beige" ||
            stored === "brown" ||
            stored === "nordic" ||
            stored === "contrast" ||
            stored === "system"
              ? stored
              : "system";
          var theme =
            preference === "system"
              ? window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark"
              : preference;

          document.documentElement.setAttribute("data-theme", theme);
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", metaColors[theme] || metaColors.dark);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
